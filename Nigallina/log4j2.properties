#Definimos como debug o trace si la inicialización de log4j está fallando
status = info
# nombre que asignamos a la configuración
name = ConsoleLogConfigDemo
# Configuración del appender para la salida por consola
appender.console.type = Console
appender.console.name = consoleLogger
# Configuración el layout del mensaje de salida
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p- %m%n
# Nivel del rootLogger, nivel que se sacará en los mensajes
rootLogger.level = info
# Appender asociado al rootLogger
rootLogger.appenderRef.stdout.ref = consoleLogger